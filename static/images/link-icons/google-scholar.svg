<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!--
    Google Scholar: a mortarboard roof over a head, after its mark.
    One unit of gap between them so the two read apart at text size.
    All shapes are filled so mask-image works reliably.
  -->
