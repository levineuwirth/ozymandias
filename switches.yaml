# The engine's switches: the features a site turns on or off in its
# site.yaml (`switches:`, a name and true or false each), resolved over the
# defaults here. The generator reads this file (build/Config.hs) and so do
# the tools and tests (tools/sitelib.py), which `make test` holds to the
# generator's resolution.
#
# Each switch:
#   kind       capability (how content is processed: filters, data, assets),
#              generated (pages built without a source file), or interface
#              (client-side behavior and page furniture);
#   default    the engine's, for a site that does not set it;
#   needs      switches that must be on with it;
#   needs-any  switches of which at least one must be on with it;
#   section    the content section it owns (site.yaml's sections), which a
#              site lists, and may feed, only with the switch on;
#   contexts   the standalone-page contexts it owns (site.yaml's standalone
#              pages' `context`), which a page may have only with it on;
#   routes     the pages it publishes at fixed paths, which site.yaml's
#              navigation and the library's see-also link only with it on
#              (or when another page takes the path: RouteCheck);
#   assets     the engine's static files (globs under engine/static/, as
#              they are served) that only it uses, published only with it on;
#   about      what it covers.
#
# A switch is registered when every place its feature appears is gated on
# it, and the engine's fixture site builds it both ways
# (tests/test_fixture_site.py); the generator refuses a site that names a
# switch not here, or turns one on without what it needs.

archive:
  kind: capability
  default: false
  routes: [/archive/]
  about: >-
    Link archiving: /archive/ and a page per entry from archive/manifest.yaml,
    the fetch stage of the build (tools/archive.py), archive annotations on
    links, citations and backlinks, and the build page's archive figures.

music:
  kind: capability
  default: false
  section: music
  assets: [js/score-reader.js, js/score-follow.js, js/music-shelf.js,
           css/composition.css, css/catalog.css, css/score-reader.css]
  about: >-
    Compositions: /music/ and its catalog, a page and a score reader per work
    under content/music/, their scores, recordings and timing maps, the
    music section in the site's lists (New, the library, the sitemap,
    feeds, keyword pages), score fragments in pages (Filters.Score, and a
    standalone page's `scores`), and the build's pruning of published score
    pages (tools/prune-site.py).

math:
  kind: capability
  default: false
  assets: [katex/**, js/katex-bootstrap.js, licenses/KaTeX-MIT.txt]
  about: >-
    TeX math: Markdown's $ and $$ read as math (PandocOptions.withMath, in
    every reader of a page, an abstract or a caption) and typeset by the
    self-hosted KaTeX the pages that have math load. Without it a $ is text.

code:
  kind: capability
  default: false
  assets: [js/prism.min.js, js/copy.js, css/syntax.css]
  about: >-
    Code blocks highlighted by Prism (Filters.Code names each block's
    language as Prism reads it, and pages with one load prism.min.js and
    syntax.css) and given a copy button (copy.js, on every page).

viz:
  kind: capability
  default: false
  assets: [js/viz.js, css/viz.css]
  about: >-
    Figures drawn by Python scripts (Filters.Viz): a .figure's SVG and a
    .visualization's Vega-Lite spec, which a page with `viz: true` loads
    Vega and viz.js to render; viz.css, which every page loads; the figure
    theme (tools/viz_theme.py) as a build dependency; and make's
    viz-provenance, viz-provenance-check (in validate) and audit-viz.

pdf-viewer:
  kind: capability
  default: false
  assets: [pdfjs/**]
  about: >-
    The vendored PDF.js viewer (static/pdfjs/, which the build downloads):
    a site's own PDFs, linked from a page or a .bib entry's `file:`, open
    in it, and {{pdf:…}} embeds it. Without it those links go to the PDF
    itself and an embed is a link to it; a PDF link keeps its class and
    preview either way.

source-refs:
  kind: capability
  default: false
  needs: [code]
  about: >-
    Links from prose to the site's own files (Filters.SourceRefs): inline
    code naming a file the /source/ mirror publishes, and links to the
    source repository, each previewed in a popup from that mirror, with
    Prism (so it needs code). Without it inline code is just code, an
    authored .source-ref link is an ordinary one, and nothing is published
    under /source/.

code-refs:
  kind: capability
  default: false
  needs: [code]
  about: >-
    Snapshots of the GitHub code that prose links to (tools/code-refs.py
    fetch, a build stage, into code-refs/), published under /code-refs/ and
    tagged on each link (Filters.CodeRefs) for a popup that shows the code,
    with Prism (so it needs code). Without it GitHub links are ordinary
    external links.

epistemic:
  kind: capability
  default: false
  assets: [templates/epistemic-figure-reference.svg]
  about: >-
    A page's epistemic profile, from its front matter (status, confidence,
    importance, evidence, scope, novelty, practicality, peer-status): the
    strip under the title, the figure beside it, the footer's Epistemic
    section and link, data/epistemic-meta.json for search's filters, and
    the build page's coverage of it. Templates ask `has-epistemic`, which
    is present only with the switch on and a status set.

marks:
  kind: capability
  default: false
  assets: [templates/mark-template.svg]
  about: >-
    Monograms (Marks.hs): a page's mark.svg in its title's left slot, or a
    placeholder roundel, in item cards and popups, and the build page's
    coverage of them. Without it the slot is left empty (marks.css, which
    also lays out the frontmatter grid, stays loaded) and no candidate
    mark is read or depended on.

vita:
  kind: capability
  default: false
  contexts: [vita, projects]
  assets: [css/vita.css]
  about: >-
    A CV page and a projects index (Vita.hs), standalone pages with the
    vita and projects contexts, rendered from yaml-source/data/*.yml (the
    files the CV's PDFs are built from), and check-site's warning when the
    CV PDFs are older than them (a site's own tools/cv-pdfs.py).

commonplace:
  kind: capability
  default: false
  assets: [css/commonplace.css, js/commonplace.js]
  about: >-
    A commonplace book (Commonplace.hs): /commonplace.html from
    content/commonplace.md and data/commonplace.yaml, by theme or by date.
    Without it content/commonplace.md, if any, is an ordinary page.

now:
  kind: capability
  default: false
  contexts: [now]
  assets: [css/now.css, js/now.js]
  about: >-
    A now page (Now.hs): a standalone page with the now context, from
    data/now.yaml, whose stamp now.js dates in the reader's calendar, and
    whose last-updated date the sitemap gives it.

signing:
  kind: capability
  default: false
  about: >-
    A detached signature beside every published file (make sign, which
    deploy runs: tools/sign-site.sh), by the subkey site.yaml's
    signing-fingerprint names, which the site must then give.

signature-link:
  kind: interface
  default: false
  needs: [signing]
  about: >-
    The footer's link to the page's signature (<page>.sig), with the
    signing key's fingerprint and its popup.

stats-page:
  kind: generated
  default: false
  routes: [/stats/]
  about: >-
    /stats/: the writing's statistics (counts, words, the activity
    heatmap, tags, notable pages).

build-page:
  kind: generated
  default: false
  routes: [/build/]
  about: >-
    /build/: the build's telemetry (corpus, pages, links, output,
    repository, timing), and the footer's link to it.

footer-build-time:
  kind: interface
  default: false
  about: >-
    The build's time in every footer: written once to _site/build/time.txt
    (make stamp-build-time, a build stage: tools/stamp-build-time.py), which
    nav.js puts in the footer's span.

tag-pages:
  kind: generated
  default: true
  about: >-
    A page per tag (/<tag>/, Tags.hs), and every link to one: the tag lists
    under pages and on cards, the home page's and the navigation's portals,
    the library's shelf headings, /stats/'s and /build/'s tag tables, and
    wikilinks to a portal by its name. Tags themselves are every site's,
    counted on /stats/ and /build/: without the switch they are shown as
    text (Sections.tagPageUrl; a tag that names a section still links its
    landing).

authors:
  kind: generated
  default: true
  about: >-
    A page per author (/authors/<slug>/, Authors.hs), and the bylines'
    links to it. Without the switch a byline names its authors as text,
    and /authors/ is no longer a reserved namespace.

bibliography-index:
  kind: generated
  default: false
  routes: [/bibliography/]
  about: >-
    /bibliography/, every work the site cites, and a page per keyword
    (/bibliography/<keyword>/: the writing and the works that name it),
    and every link to one: a page's keywords and its bibliography
    entries'. Without the switch keywords are shown as text.

library:
  kind: generated
  default: false
  routes: [/library.html]
  about: >-
    /library.html: a shelf per portal, with content/library.md as its
    intro, and the bibliography pages' link to it. It needs site.yaml's
    library block, which is otherwise optional (its see-also also lists
    the bibliography pages' links).

random:
  kind: generated
  default: false
  assets: [js/random.js]
  about: >-
    The home page's Random link: /random-pages.json, the essays, posts,
    fiction and poems it chooses among, and random.js, which follows it.
    Without the switch a [data-random] link goes to its own href.

new:
  kind: generated
  default: true
  routes: [/new.html]
  about: >-
    /new.html, everything by its date, newest first, and the mark between
    a page's sections that links it (without the switch the mark is only
    drawn).
