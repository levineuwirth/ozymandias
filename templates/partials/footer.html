<!-- The engine's footer, for a site that brings none of its own: the
     site's host and code license from site.yaml (Config.identityContext).
     The right part balances the left, so the license sits centered, and
     holds what a switch adds: the build page's link, the signature
     link. A site overrides it at templates/partials/footer.html. -->
<footer data-pagefind-ignore="all">
    <div class="footer-left">
        <button class="footer-totop" aria-label="Return to top">↑ top</button>
        <a href="/">$site-host$</a>
    </div>
    <div class="footer-center">
        <span class="footer-license"><a href="$site-source-repo$">$site-code-license$</a></span>
    </div>
    <div class="footer-right">$if(switch-build-page)$<a href="/build/" class="footer-build-link" aria-label="Build telemetry">build</a>$endif$$if(switch-signature-link)$$if(switch-build-page)$ · $endif$<a href="$url$.sig" class="footer-sig-link" title="Signed by key $site-signing-fingerprint$">sig<span class="visually-hidden">: PGP signature for this page</span></a>$endif$</div>
</footer>
