<main id="markdownBody" data-no-collapse>
    <header class="tag-head tag-map-head">
        <h1 class="page-title">$title$</h1>
        <p class="tag-facts">$map-facts$</p>
        <p class="tag-gloss">$description$</p>
    </header>
    <figure class="tag-map-figure tag-map-figure--whole">
        $tag-map$
    </figure>
    <section class="tag-map-index" aria-labelledby="tag-map-index-heading">
        <h2 id="tag-map-index-heading" class="tag-label">Every tag on the map, and what is filed under it</h2>
        $map-index$
    </section>
</main>
