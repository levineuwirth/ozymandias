<main id="markdownBody" data-pagefind-body>
    <h1 class="page-title">$title$</h1>
    <div class="cp-intro">$body$</div>
    <nav class="cp-view-toggle" aria-label="View mode">
        <button class="cp-toggle-btn is-active" data-target="cp-themed">by theme</button>
        <button class="cp-toggle-btn" data-target="cp-chrono">chronological</button>
    </nav>
    $cp-themed-html$
    $cp-chrono-html$
</main>
$partial("templates/partials/page-footer.html")$
<!-- The view toggle's behaviour lives in /js/commonplace.js, loaded from
     templates/default.html behind the same commonplace flag that gates
     /css/commonplace.css in head.html. It used to be an inline script
     here — the one page that would have violated the script-src in
     nginx/security-headers.conf, which is why that policy is still
     report-only. Externalising it is the prerequisite for enforcing it.
     NB: template syntax is interpolated inside HTML comments too, so no
     dollar signs in this note. -->
