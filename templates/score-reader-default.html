<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="ozy:assets" content="$assets$">
<meta name="ozy:author" content="$site-author$">
<title>$title$ — Score — $site-title$</title>
<link rel="stylesheet" href="$assets$/css/base.css">
<link rel="stylesheet" href="$assets$/css/components.css">
<link rel="stylesheet" href="$assets$/css/score-reader.css">
<!-- utils.js must precede theme.js: theme.js reads saved settings via
     window.ozyUtils.safeStorage and silently restores nothing without it. -->
$for(seasons)$<meta name="ozy:season" content="$season-id$" data-base="$season-base$" data-from="$season-from$" data-to="$season-to$">
$endfor$<script src="$assets$/js/utils.js"></script>
<script src="$assets$/js/theme.js"></script>
</head>
<body class="score-reader-page">
<a class="skip-link" href="#score-reader-stage">Skip to score</a>
$body$
<script src="$assets$/js/settings.js" defer></script>
<script src="$assets$/js/score-reader.js" defer></script>
$if(realization)$<script src="$assets$/js/score-follow.js" defer></script>$endif$
</body>
</html>
