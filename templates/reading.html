<div id="reading-progress" aria-hidden="true"></div>
<!-- A05: neutral element — see templates/essay.html. -->
<div class="essay-frontmatter essay-frontmatter--reading">
    <div class="frontmatter-mark-slot frontmatter-mark-slot--left">$monogramSvg$</div>
    <div class="frontmatter-title">
        <h1 class="page-title">$title$</h1>
        $if(subtitle)$<p class="essay-subtitle">$subtitle$</p>$endif$
        $partial("templates/partials/metadata-header.html")$
    </div>
</div>
<div class="essay-tailmatter">
    $partial("templates/partials/metadata-tail.html")$
    $if(summary)$
    <div class="essay-summary" data-pagefind-ignore="all">
        $summary$
    </div>
    $endif$
</div>
<!-- A04: the rule and the mark are drawn by CSS (::before/::after and a
     mask-image on the anchor), so nothing here needs aria-hidden. The
     anchor is a real destination and stays exposed with an accessible
     name; hiding it from assistive technology while leaving it in the
     tab order was the defect. -->
<div class="content-divider content-divider--frontmatter">
    <a href="/new.html" class="content-divider-logo"><span class="visually-hidden">New</span></a>
</div>
<main id="markdownBody" data-pagefind-body$if(no-collapse)$ data-no-collapse$endif$>
    $body$
</main>
$partial("templates/partials/page-footer.html")$
