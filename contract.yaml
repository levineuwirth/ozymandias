# The override contract: the templates a site may override (by a file at
# the same path, declared in its overrides.yaml), what the engine gives each
# and what it needs back. tools/override-review.py and the overrides tests
# read it.
#
# contexts: the fields the engine renders a template with, by group, each
#   with a fixture value: a string; true for a flag; a list of objects for
#   a loop (whose items have $plain(...)$ only with `$plain: true`, as the
#   engine's lists of pages do and its lists of links or tags do not). A
#   template is rendered with its groups' fields and no others,
#   so a field it uses that the contract does not give fails the check
#   (`site render-template`, build/Contract.hs).
# templates: each override point, by its path under templates/:
#   context  the groups it is rendered with;
#   hooks    what the rendered template must contain, each a CSS selector
#            (a tag, classes, an id, attributes), with the engine files that
#            bind to it (`by`, under engine/) and why it matters; `root:
#            true` when the element must be at the template's top level,
#            where the engine places it as it is;
#   optional what the engine binds to when it is there, which a site may
#            leave out (and lose that behavior).
# A template a site overrides needs an entry; one with no hooks says so.
#
# The stylesheets a site overrides (static/css/theme.css, fonts.css,
# site.css, declared in overrides.yaml as templates are) need none: they
# bind by the cascade, and, bundled, cannot @import (the build refuses
# one). Their rules go inside `@layer site`, which wins over
# the engine's `@layer engine` whatever the specificity, except against the
# engine's !important declarations (`[hidden]`, print visibility): those win
# over any site declaration, a site's !important too, since CSS reverses
# the layer order for important ones. README.md, "Styling a site".
#
# scripts: what a site's own script may extend instead of copying an engine
#   file (JS is extended, not copied): each a global or an event, the engine
#   file that provides it (by), which tools/override-review.py holds to
#   defining it, and how to use it. A site's script comes after the
#   engine's, deferred (site.yaml's scripts, on every page; a page's `js:`
#   front matter; or a template override), and registers before the page
#   has loaded (on a page with math, math.js alone comes after a site's
#   scripts: it typesets, and registers nothing);
#   tests/test_browser_registries.py is one.
scripts:
  ozy:content-added:
    by: static/js/utils.js
    use: >-
      A bubbling event on content inserted after load (a transclusion, or a
      site script's own), once per insertion, with detail {container,
      source}. Dispatched synchronously after calling the sidenote, popup
      and collapse reinitialisers; asynchronous work may still be pending.
      This announces insertion, not completed highlighting or typesetting:
      document.addEventListener('ozy:content-added', e => init(e.detail.container)).
  window.ozyEnhance:
    by: static/js/utils.js
    use: >-
      ozyEnhance(container[, {source, force}]) announces content a site's
      script inserted: sidenotes, popups and collapsing sections take it
      up, then ozy:content-added is dispatched synchronously. Code and math
      are also highlighted and typeset with their switches on, but that
      work may finish after the event. Once per container unless forced.
  window.ozyPopups:
    by: static/js/popups.js
    use: >-
      With the popups switch. bind(order, selector, content) gives the
      elements selector finds a preview, content(target) returning a
      Promise of HTML, a Node, or null for none, among the engine's
      binders by order (popups.js, "Binding": an element keeps the first);
      exclude(selector) gives internal links inside it none; onShow(fn) is
      called with the popup once it is shown and placed.
  window.ozySelection:
    by: static/js/selection-popup.js
    use: >-
      With the selection-toolbar switch. context(name, test, buttons) adds
      a context the selection is in when test(element, range) says so,
      shown with buttons({oneWord, text}) (HTML; btn(action, label) makes
      one); codeExtra(fn) adds HTML after Copy for selected code;
      action(name, fn) is what a button with data-action=name does, given
      the selected text and the button.
  window.ozyPhotography:
    by: static/js/photography-modes.js
    use: >-
      With the photography switch. registerMode(name, {enter(grid),
      leave(grid)}) adds a layout of the photography grid, or replaces one
      of the engine's (grid, masonry, chronological): the toggle's
      data-mode and the grid's data-photography-mode, which a site's CSS
      keys its rules off; the reader's choice is kept as the engine's are.
      A mode owns its listeners and queued work: enter installs them and
      leave removes or cancels them. Repeated selection can call enter
      again without leave, so enter must not stack listeners.
      Defined on photography's pages (photography-modes.js loads with
      them), so a script that runs on every page asks for it first:
      if (window.ozyPhotography) .... photos() is a Promise of
      photos.json's entries (data:), fetched once: a presentation of a
      site's own builds from them, not from the engine's markup. registerMap({marker, tooltip, target, ready}) draws
      the map's places a site's way, each hook given a place {lat, lon,
      pins (map.json's), label}: marker returns any of {className, html,
      size, title} over the engine's; tooltip its HTML, or null for none;
      target the URL a click goes to, or null; ready(map, layer, places)
      is called with the drawn Leaflet map. Register before the page has
      loaded; what a site leaves out is the engine's.

# data: what the engine publishes and reads about photographs (the
#   photography switch), for a site's own presentation to build from: each
#   file's engine source (by), how to use it, and its keys (a list's, its
#   items' keys). test_fixture_site holds the published files to these,
#   and test_photo_tools the sidecars to their extractors.
data:
  photography/photos.json:
    by: build/Photography.hs
    use: >-
      {"photos": [...]}, every published entry, newest first: a single or a
      series' frame (kind photo) or a series' landing (kind series), with
      each key it has, as its templates are given it (the photo group;
      title and abstract may hold HTML). window.ozyPhotography.photos()
      fetches it once. No coordinates.
    keys:
      kind: photo or series
      frames: a series' frames' URLs, in its grid's order (series only)
      slug: its directory's name, or a flat single's own
      title: the title
      alt: the authored alt text
      abstract: the caption
      photo: the photo front matter key as written
      photo-url: the photograph's URL, beside its entry
      photo-webp-url: its WebP's URL
      photo-srcset: its responsive variants and itself, a srcset
      photo-webp-srcset: the same in WebP
      width: pixel width
      height: pixel height
      orientation: landscape, portrait or square
      camera: the camera
      lens: the lens
      film: the film stock
      process: the development process
      exposure: the exposure, as written
      shutter: the shutter speed
      aperture: the aperture
      iso: the ISO
      focal-length: the focal length
      captured: the capture date as written
      captured-display: the capture date, for reading
      captured-iso: the capture date, ISO 8601
      location: the place, as written
      series: a frame's series' slug
      canonical-url: the entry's page
      date: the publication date, for reading
      date-iso: the publication date, ISO 8601
      license: its own license, as written
      license-url-resolved: that license's URL
      palette-swatches: [swatch]
      photo-links: [link-name, link-url]
      photography-tags: [tag-name, tag-url]
      author-links: [author-name, author-url]
      series-frame-count: a series' number of frames
      series-bytes: its delivery files' total size
      series-captured-span: when its frames were made
      series-cameras: its cameras
      series-lenses: its lenses
      series-focal-span: its focal lengths
      series-iso-span: its ISOs
      series-locations: its places
  photography/map.json:
    by: build/Photography.hs
    use: >-
      An array of pins, one per published photograph with geo: and a
      geo-precision other than hidden (default city), its coordinates
      rounded to that precision before they leave the build.
    keys:
      slug: >-
        the directory its photograph is in (a frame's series, a directory
        single's own), or a flat single's name: not photos.json's slug
      title: the title
      url: >-
        the entry's page: photos.json's canonical-url, the key that joins
        a pin to its entry
      lat: latitude, rounded
      lon: longitude, rounded
      thumb: >-
        its 480px variant's URL, else the photograph's: root-relative on
        this site, or the photo key's own URL when that names another
      captured: the capture date as written
      location: the place, as written
      series: a frame's series' slug
  "{photo}.exif.yaml":
    by: tools/extract-exif.py
    use: >-
      Beside each photograph, from its EXIF (make build writes it). Front
      matter wins over each key: a film scan has no EXIF, so its camera is
      written in front matter.
    keys:
      camera: the camera
      lens: the lens
      exposure: the exposure
      shutter: the shutter speed
      aperture: the aperture
      iso: the ISO
      focal-length: the focal length
      captured: the capture date
      geo: the coordinates, unrounded (read by no published page)
      width: pixel width
      height: pixel height
  "{photo}.palette.yaml":
    by: tools/extract-palette.py
    use: Beside each photograph, its dominant colors; a palette in front matter wins.
    keys:
      palette: hex colors
  "{photo}.dims.yaml":
    by: tools/extract-dimensions.py
    use: Beside each image, its pixel size, when no EXIF sidecar gives one.
    keys:
      width: pixel width
      height: pixel height

contexts:
  identity: &identity
    site-title: Example Site
    site-author: Example Author
    site-author-sort: "Author, Example"
    site-url: https://example.org
    site-host: example.org
    site-email: author@example.org
    site-contact-email: contact@example.org
    site-source-repo: https://git.example.org/author/site
    site-code-license: MIT
    site-signing-fingerprint: 0000 1111 2222 3333 4444 5555 6666 7777 8888 9999
    site-feeds:
      - {feed-title: Example Site, feed-url: /feed.xml}
    font-preloads:
      - {href: /fonts/example-regular.woff2}
  page: &page
    url: /essays/example/
    title: An Example
    # A page's own license, when its front matter has one (`license:`), and
    # the URL it resolves to (Contexts.licenseUrlField).
    license: Public domain
    license-url-resolved: https://creativecommons.org/publicdomain/mark/1.0/
  # The switches a template asks ($if(switch-NAME)$, Config.switchContext),
  # each on, so that what they gate renders and its hooks are checked.
  switches: &switches
    switch-build-page: true
    switch-footer-build-time: true
    switch-signature-link: true
    switch-new: true

  # A photograph's fields (Contexts.photographyCtx): its own page's, and
  # each item's of a list of photographs (photos, series-photos), which is
  # what photo-card.html is rendered with. The engine computes the URLs,
  # srcsets, dimensions, capture date and lists; the rest is front matter
  # as written, and camera to height fall back to the photograph's
  # sidecars (`data:` below). Any field may be absent but title: guard it
  # with $if$. A series child carries series:, its directory's name.
  photo: &photo
    photography: true
    slug: example-frame
    title: Example Frame
    alt: A pier in fog
    abstract: The first frame of the roll.
    photo: example-frame.jpg
    photo-url: /photography/example-series/example-frame.jpg
    photo-webp-url: /photography/example-series/example-frame.webp
    photo-srcset: /photography/example-series/example-frame.w480.jpg 480w, /photography/example-series/example-frame.jpg 1600w
    photo-webp-srcset: /photography/example-series/example-frame.w480.webp 480w
    width: "1600"
    height: "1067"
    orientation: landscape
    camera: Example Camera
    lens: 50mm f/2
    film: Example 400
    process: C-41
    exposure: 1/125 s at f/8
    shutter: 1/125
    aperture: f/8
    iso: "400"
    focal-length: 50mm
    captured: "2026-04-21"
    captured-display: 21 April 2026
    captured-iso: "2026-04-21"
    location: Example Town, Example Country
    series: example-series
    canonical-url: /photography/example-series/example-frame/
    date: 1 May 2026
    date-iso: "2026-05-01"
    palette-swatches:
      - {swatch: "#2f3a40"}
    photo-links:
      - {link-name: Elsewhere, link-url: https://photos.example.org/frame}
    photography-tags:
      - {tag-name: fog, tag-url: /photography/tags/fog/}
    author-links:
      - {author-name: Example Author, author-url: /authors/example-author/}
    # The pages that link to it, from the build's first pass (make build).
    backlinks: <ul><li><a href="/essays/example/">An Example</a></li></ul>
    footer-deps: true
  # A series landing's (Photography.seriesCtx), over its own photo fields:
  # its photographs, newest first, and what the build counts of them, each
  # absent when the series cannot say. A list's photograph is given what a
  # photograph's own page is (photographyCtx, with the site's fields and
  # plain), so photo-card.html, which renders one, has the same in a loop
  # as alone.
  series:
    is-series: true
    series-photos:
      - &card
        <<: [*photo, *page, *identity, *switches]
        url: /photography/example-series/example-frame/
        $plain: true
      - *card
    series-frame-count: "2"
    series-bytes: 3.1 MB
    series-captured-span: April 2026
    series-cameras: Example Camera
    series-lenses: 50mm f/2
    series-focal-span: 50mm
    series-iso-span: "400"
    series-locations: Example Town
  # A page listing photographs: the section's landing (its prose in
  # body), a year's page and the contact sheet. Newest first, but the
  # contact sheet's, oldest first.
  photo-list:
    photos: [*card, *card]
  # The flags the section's generated pages carry: every one (photography),
  # the landing's and a year's (list-page), the contact sheet's and the
  # map's (portal), and the map's own (photography-map).
  photography:
    photography: true
  list-page:
    list-page: true
  portal:
    portal: true
  photo-map:
    photography-map: true
  # A page's own prose, rendered: a photograph's notes, a series' or the
  # section's introduction. (A photograph in a list has none to give.)
  prose:
    body: <p>Notes on the frame.</p>
  # The view a page is: the map page's controls mark Map as current.
  photo-view:
    photography-view-map: true
  # A year's page, and the index of years.
  photo-year:
    year: "2026"
  photo-years:
    years:
      - {year: "2026", year-url: /photography/by-year/2026/, year-count: "2"}

templates:
  templates/404.html:
    context: [identity, page]
    hooks: []

  templates/partials/footer.html:
    context: [identity, page, switches]
    hooks:
      - selector: footer
        root: true
        by: [static/css/layout.css, static/css/print.css]
        why: >-
          default.html puts the partial in the page shell, whose direct
          child footer is laid out at every width and hidden in print
      - selector: footer[data-pagefind-ignore]
        root: true
        by: [tools/embed.py]
        why: search's indexes (Pagefind, the semantic embeddings) leave it out
    optional:
      - selector: button.footer-totop
        by: [static/js/nav.js, static/css/layout.css]
        why: return to top
      - selector: "[data-build-time]"
        by: [static/js/nav.js]
        why: the build time, filled from /build/time.txt
      - selector: a.footer-sig-link
        by: [static/js/popups/signature.js]
        why: the signature's popup

  templates/partials/ornament.html:
    context: []
    hooks:
      - selector: .footer-ornament
        by: [static/css/aftermatter.css, static/css/print.css]
        why: its width and ink, and hidden in print

  # Photography (the photography switch). A hook here is what the engine's
  # scripts bind to; the classes the engine's stylesheets style are not
  # hooks, since a site that overrides a template styles its own markup.
  # What a site's presentation needs beyond these is in the photographs'
  # data (`data:`) and window.ozyPhotography (`scripts:`).
  templates/photography.html:
    context: [identity, page, switches, photo, prose]
    hooks:
      - selector: "#markdownBody"
        by: [templates/default.html]
        why: the skip link's destination, the page's main content
      - selector: img[data-lightbox]
        by: [static/js/lightbox.js]
        why: the photograph opens in the darkroom
    optional:
      - selector: img[data-photo-captured]
        by: [static/js/lightbox.js]
        why: >-
          the darkroom's information panel shows the trigger's
          data-photo-captured, -location, -camera, -lens, -film and
          -exposure, each that it has

  templates/photography-series.html:
    context: [identity, page, switches, photo, series, prose]
    hooks:
      - selector: "#markdownBody"
        by: [templates/default.html]
        why: the skip link's destination, the page's main content
      - selector: .photography-grid[data-photography-mode]
        by: [static/js/photography-modes.js, static/js/photography-slideshow.js, static/js/popups/photography.js]
        why: >-
          the grid the view modes lay out (data-photography-mode names the
          one shown), the slideshow plays and popups leave alone
    optional:
      - selector: img[data-lightbox]
        by: [static/js/lightbox.js]
        why: the lead photograph opens in the darkroom

  templates/photography-index.html:
    context: [identity, page, switches, photography, photo-list, list-page, prose]
    hooks:
      - selector: "#markdownBody"
        by: [templates/default.html]
        why: the skip link's destination, the page's main content
      - selector: .photography-grid[data-photography-mode]
        by: [static/js/photography-modes.js, static/js/popups/photography.js]
        why: the grid the view modes lay out, and popups leave alone

  templates/photography-by-year.html:
    context: [identity, page, switches, photography, photo-list, list-page, photo-year]
    hooks:
      - selector: "#markdownBody"
        by: [templates/default.html]
        why: the skip link's destination, the page's main content
    optional:
      - selector: .photography-grid[data-photography-mode]
        by: [static/js/photography-modes.js, static/js/popups/photography.js]
        why: a grid of cards is sized as the landing's is, and popups leave it alone

  templates/photography-by-year-index.html:
    context: [identity, page, switches, photography, photo-years]
    hooks:
      - selector: "#markdownBody"
        by: [templates/default.html]
        why: the skip link's destination, the page's main content

  templates/photography-contact-sheet.html:
    context: [identity, page, switches, photography, photo-list, portal]
    hooks:
      - selector: "#markdownBody"
        by: [templates/default.html]
        why: the skip link's destination, the page's main content
    optional:
      - selector: .photography-contact-sheet
        by: [static/js/photography-modes.js]
        why: its frames' image sizes follow their rendered width

  templates/photography-map.html:
    context: [identity, page, switches, photography, photo-map, portal, photo-view]
    hooks:
      - selector: "#markdownBody"
        by: [templates/default.html]
        why: the skip link's destination, the page's main content
      - selector: "#photography-map"
        by: [static/js/photography-map.js]
        why: the element the map is drawn in, its state classes added to it

  templates/partials/photo-card.html:
    context: [identity, page, switches, photo]
    hooks:
      - selector: li.photo-card
        root: true
        by: [static/js/photography-modes.js, static/js/photography-slideshow.js]
        why: >-
          one photograph of a grid (a ul): the modes size it, the slideshow
          takes a frame from each
      - selector: a.photo-card-link
        by: [static/js/photography-slideshow.js]
        why: the frame's page, the slideshow's link to it
      - selector: img.photo-card-img
        by: [static/js/photography-modes.js]
        why: its sizes follow the card's rendered width
    optional:
      - selector: li[data-orientation]
        by: [static/js/photography-modes.js]
        why: masonry's placeholder shape before the image loads
      - selector: .photo-card-meta
        by: [static/js/photography-modes.js]
        why: masonry leaves room for it under the photograph
      - selector: .photo-card-title
        by: [static/js/photography-slideshow.js]
        why: the slideshow's caption
      - selector: time.photo-card-date
        by: [static/js/photography-slideshow.js]
        why: the slideshow's date

  templates/partials/photography-controls.html:
    context: [series, photo-view]
    hooks:
      - selector: .mode-btn[data-mode]
        by: [static/js/photography-modes.js]
        why: >-
          a view, wherever the controls put it: its data-mode is a
          registered mode, which choosing applies in place (the chosen one
          carries aria-current), or a page (map) it links to
    optional:
      - selector: button[data-mode=slideshow]
        by: [static/js/photography-slideshow.js]
        why: starts the slideshow, on a series
