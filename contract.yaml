# The override contract: the templates a site may override (by a file at
# the same path, declared in its overrides.yaml), what the engine gives each
# and what it needs back. tools/override-review.py and the overrides tests
# read it.
#
# contexts: the fields the engine renders a template with, by group, each
#   with a fixture value: a string; true for a flag; a list of objects for
#   a loop. A template is rendered with its groups' fields and no others,
#   so a field it uses that the contract does not give fails the check
#   (`site render-template`, build/Contract.hs).
# templates: each override point, by its path under templates/:
#   context  the groups it is rendered with;
#   hooks    what the rendered template must contain, each a CSS selector
#            (a tag, classes, an id, attributes), with the engine files that
#            bind to it (`by`, under engine/) and why it matters; `root:
#            true` when the element must be at the template's top level,
#            where the engine places it as it is;
#   optional what the engine binds to when it is there, which a site may
#            leave out (and lose that behavior).
# A template a site overrides needs an entry; one with no hooks says so.
#
# The stylesheets a site overrides (static/css/theme.css, fonts.css,
# site.css, declared in overrides.yaml as templates are) need none: they
# bind by the cascade, and, bundled, cannot @import (the build refuses
# one). Their rules go inside `@layer site`, which wins over
# the engine's `@layer engine` whatever the specificity, except against the
# engine's !important declarations (`[hidden]`, print visibility): those win
# over any site declaration, a site's !important too, since CSS reverses
# the layer order for important ones. README.md, "Styling a site".
#
# scripts: what a site's own script may extend instead of copying an engine
#   file (JS is extended, not copied): each a global or an event, the engine
#   file that provides it (by), which tools/override-review.py holds to
#   defining it, and how to use it. A site's script comes after the
#   engine's, deferred (a page's `js:` front matter, or a template
#   override), and registers before the page has loaded;
#   tests/test_browser_registries.py is one.
scripts:
  ozy:content-added:
    by: static/js/utils.js
    use: >-
      A bubbling event on content inserted after load (a transclusion, or a
      site script's own), once per insertion, with detail {container,
      source}, after the engine's own scripts have seen it:
      document.addEventListener('ozy:content-added', e => init(e.detail.container)).
  window.ozyEnhance:
    by: static/js/utils.js
    use: >-
      ozyEnhance(container[, {source, force}]) announces content a site's
      script inserted: sidenotes, popups and collapsing sections take it
      up, code and math in it are highlighted and typeset (with the code
      and math switches), and ozy:content-added follows. Once per
      container unless forced.
  window.ozyPopups:
    by: static/js/popups.js
    use: >-
      With the popups switch. bind(order, selector, content) gives the
      elements selector finds a preview, content(target) returning a
      Promise of HTML, a Node, or null for none, among the engine's
      binders by order (popups.js, "Binding": an element keeps the first);
      exclude(selector) gives internal links inside it none; onShow(fn) is
      called with the popup once it is shown and placed.
  window.ozySelection:
    by: static/js/selection-popup.js
    use: >-
      With the selection-toolbar switch. context(name, test, buttons) adds
      a context the selection is in when test(element, range) says so,
      shown with buttons({oneWord, text}) (HTML; btn(action, label) makes
      one); codeExtra(fn) adds HTML after Copy for selected code;
      action(name, fn) is what a button with data-action=name does, given
      the selected text and the button.
  window.ozyPhotography:
    by: static/js/photography-modes.js
    use: >-
      With the photography switch. registerMode(name, {enter(grid),
      leave(grid)}) adds a layout of the photography grid, or replaces one
      of the engine's (grid, masonry, chronological): the toggle's
      data-mode and the grid's data-photography-mode, which a site's CSS
      keys its rules off; the reader's choice is kept as the engine's are.

contexts:
  identity:
    site-title: Example Site
    site-author: Example Author
    site-author-sort: "Author, Example"
    site-url: https://example.org
    site-host: example.org
    site-email: author@example.org
    site-contact-email: contact@example.org
    site-source-repo: https://git.example.org/author/site
    site-code-license: MIT
    site-signing-fingerprint: 0000 1111 2222 3333 4444 5555 6666 7777 8888 9999
    site-feeds:
      - {feed-title: Example Site, feed-url: /feed.xml}
    font-preloads:
      - {href: /fonts/example-regular.woff2}
  page:
    url: /essays/example/
    title: An Example
    # A page's own license, when its front matter has one (`license:`), and
    # the URL it resolves to (Contexts.licenseUrlField).
    license: Public domain
    license-url-resolved: https://creativecommons.org/publicdomain/mark/1.0/
  # The switches a template asks ($if(switch-NAME)$, Config.switchContext),
  # each on, so that what they gate renders and its hooks are checked.
  switches:
    switch-build-page: true
    switch-footer-build-time: true
    switch-signature-link: true

templates:
  templates/404.html:
    context: [identity, page]
    hooks: []

  templates/partials/footer.html:
    context: [identity, page, switches]
    hooks:
      - selector: footer
        root: true
        by: [static/css/layout.css, static/css/print.css]
        why: >-
          default.html puts the partial in the page shell, whose direct
          child footer is laid out at every width and hidden in print
      - selector: footer[data-pagefind-ignore]
        root: true
        by: [tools/embed.py]
        why: search's indexes (Pagefind, the semantic embeddings) leave it out
    optional:
      - selector: button.footer-totop
        by: [static/js/nav.js, static/css/layout.css]
        why: return to top
      - selector: "[data-build-time]"
        by: [static/js/nav.js]
        why: the build time, filled from /build/time.txt
      - selector: a.footer-sig-link
        by: [static/js/popups/signature.js]
        why: the signature's popup

  templates/partials/ornament.html:
    context: []
    hooks:
      - selector: .footer-ornament
        by: [static/css/aftermatter.css, static/css/print.css]
        why: its width and ink, and hidden in print
